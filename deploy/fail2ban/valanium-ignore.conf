# /etc/fail2ban/jail.d/valanium-ignore.conf
#
# Узлы своей сети банить нельзя.
#
# Отправка бэкапа ходит на приёмник по wg0 под forced command rrsync, и каждая
# отбитая попытка выглядит для sshd неудачным заходом. При mode = aggressive
# этого хватило, чтобы забанить собственный main: 30.08.2026 отправка копий
# встала, ping при этом проходил, sshd на приёмнике был active — снаружи всё
# выглядело здоровым, и увидеть причину можно было только в правилах nftables.
#
# Внешние адреса это не ослабляет: 10.77.0.0/24 — приватная сеть WireGuard,
# попасть в неё можно только имея ключ пира.

[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 10.77.0.0/24
